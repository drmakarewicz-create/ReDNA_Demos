# DNA category weights for curiosity calculation
# Higher values indicate greater importance in curiosity scoring

PaDNA:
  default: 1.0
  EyeDNA:
    IrisColor: 0.8
    Shape: 0.7
  HairDNA:
    Color: 0.85
    Texture: 0.75
  SkinDNA:
    Tone: 0.9
    Texture: 0.7

PsyDNA:
  default: 1.0
  PersonalityTraits:
    Openness: 0.9
    Conscientiousness: 0.85
    Extraversion: 0.8
    Agreeableness: 0.8
    Neuroticism: 0.75
  CognitiveStyle:
    default: 0.8
  EmotionalPatterns:
    default: 0.85

SocialDNA:
  default: 0.9
  Relationships:
    default: 0.85
  Communication:
    default: 0.8

# Fallback weight for any trait not explicitly listed
fallback: 0.75
