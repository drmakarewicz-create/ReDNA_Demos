# Traits Registry Patch: padna-refine-LLTEST-v1
# Timestamp: 2025-10-03T20:30:00Z
# Purpose: Add granular PaDNA containers for improved portrait realism
# Append-only additions - does not modify existing containers

PaDNA:

  # ---- Enhanced Eye/Iris Detail (Delta #1) ----
  EyeDNA:
    Iris:
      BaseColor:
        type: categorical
        choices: [brown, light-brown, dark-brown, blue, light-blue, dark-blue, green, light-green, dark-green, hazel, gray, light-gray, amber, mixed]

      Flecks:
        type: categorical
        choices: [none, hazel, gold, brown, copper, green, blue, amber, mixed]

      FleckPattern:
        type: categorical
        choices: [none, scattered, central, radial, dense, random]

      LimbalRing:
        type: categorical
        choices: [none, faint, moderate, prominent, dark-prominent]

      Saturation:
        type: number
        min: 0
        max: 100
        units: percent

    # Enhanced spacing/size (Delta #7)
    Spacing:
      type: categorical
      choices: [close, average, wide]

    EyeSize:
      type: categorical
      choices: [small, medium, large, very-large]

  # ---- Enhanced Skin/Freckles Detail (Delta #2) ----
  SkinDNA:
    Freckles:
      Density:
        type: categorical
        choices: [none, light, medium, heavy, very-heavy]

      Coverage:
        type: categorical
        choices: [none, cheeks-only, t-zone, full-face, face-shoulders, face-neck-shoulders, body-extensive]

      Contrast:
        type: categorical
        choices: [subtle, visible, prominent, stark]

    # Enhanced Undertone (Delta #3)
    Undertone:
      Type:
        type: categorical
        choices: [cool, neutral, warm, golden-warm, peachy-warm, olive, reddish, ashy-cool]

      Intensity:
        type: categorical
        choices: [subtle, moderate, strong, very-strong]

  # ---- Enhanced Hair Color (Delta #4) ----
  HairDNA:
    Color:
      Base:
        type: categorical
        choices: [black, dark-brown, medium-brown, light-brown, chestnut, auburn, red-auburn, copper, strawberry-blonde, blonde, ash-blonde, platinum-blonde, gray, white, mixed]

      Highlights:
        type: categorical
        choices: [none, natural-subtle, natural-prominent, sun-kissed, copper, gold, caramel, platinum, lowlights, balayage, ombre]

      Dimension:
        type: categorical
        choices: [flat-monochrome, subtle-variation, moderate-dimension, high-dimension, multi-tonal]

    # Enhanced Curl Pattern (Delta #5)
    CurlPattern:
      type: categorical
      choices: [straight-1, wavy-2A, wavy-2B, wavy-2C, curly-3A, curly-3B, curly-3C, coily-4A, coily-4B, coily-4C, mixed-pattern]

    WaveDefinition:
      type: categorical
      choices: [loose, medium, defined, tight, irregular]

    # Enhanced Parting (Delta #6)
    Parting:
      Side:
        type: categorical
        choices: [left, right, center, zigzag, none, variable]

      Consistency:
        type: categorical
        choices: [low, medium, high, always]

    Volume:
      type: categorical
      choices: [flat, low, medium, high, very-high]

  # ---- Enhanced Facial Structure (Delta #7, #8) ----
  FaceDNA:
    EyeSpacing:
      type: categorical
      choices: [very-close, close, average, wide, very-wide]

    EyeSizeRelative:
      type: categorical
      choices: [small, medium-small, medium, medium-large, large]

    Cheekbones:
      type: categorical
      choices: [flat, subtle, moderate, prominent, high-sharp]

    CheekboneHeight:
      type: categorical
      choices: [low, mid, high]

  # ---- Enhanced Smile/Lip Detail (Delta #9) ----
  SmileDNA:
    LipFullness:
      type: categorical
      choices: [thin, medium-thin, medium, medium-full, full, very-full]

    CupidsBow:
      type: categorical
      choices: [absent, subtle, defined, pronounced, sharp]

    LipSymmetry:
      type: categorical
      choices: [symmetric, slightly-asymmetric, asymmetric]

    UpperLipFullness:
      type: categorical
      choices: [thin, medium, full]

    LowerLipFullness:
      type: categorical
      choices: [thin, medium, full]

# Migration notes (for future use):
# - PaDNA.EyeDNA.Color should eventually migrate to PaDNA.EyeDNA.Iris.BaseColor + Flecks
# - PaDNA.SkinDNA.Freckles (text) should migrate to PaDNA.SkinDNA.Freckles.Density + Coverage + Contrast
# - PaDNA.SkinDNA.Tone + Undertone should use PaDNA.SkinDNA.Undertone.Type + Intensity
# - PaDNA.HairDNA.Color should migrate to PaDNA.HairDNA.Color.Base + Highlights + Dimension
# - PaDNA.HairDNA.Texture (wavy) should use PaDNA.HairDNA.CurlPattern + WaveDefinition
# - PaDNA.HairDNA.Part should use PaDNA.HairDNA.Parting.Side + Consistency

# ============================================================================
# Traits Registry Patch v2: BSTest + Extended Refinements
# Timestamp: 2025-10-03
# Purpose: Add makeup, hair accessories, body/tattoos, hands, jewelry, apparel,
#          behavioral, and style context containers
# ============================================================================

PaDNA:

  # ---- Eyebrow Detail (v2) ----
  BrowDNA:
    Shape:
      type: categorical
      choices: [straight, soft-arch, arched-soft-angle, high-arch, s-curve]

    Thickness:
      type: categorical
      choices: [thin, medium-thin, medium, medium-thick, thick]

    Color:
      type: categorical
      choices: [light-blonde, blonde, dark-blonde, light-brown, medium-brown, dark-brown, black]

  # ---- Extended Skin Detail (v2) ----
  SkinDNA:
    Texture:
      type: categorical
      choices: [airbrushed, smooth, natural-with-visible-pores, coarse]

    TanLevel:
      type: categorical
      choices: [pale, fair, sun-kissed, tan, deep]

  # ---- Extended Hair Detail (v2) ----
  HairDNA:
    RootContrast:
      type: categorical
      choices: [none, faint, visible-darker-roots, strong]

    Tone:
      type: categorical
      choices: [cool-ash, neutral, warm-golden, coppery, mixed]

    UpdoStyle:
      type: categorical
      choices: [none, ponytail, messy-high-bun, sleek-bun, half-up]

    Accessories:
      type: categorical
      choices: [none, flower-crowns, ribbons, clips, headband, mixed]

  # ---- Forehead Detail (v2) ----
  ForeheadDNA:
    Height:
      type: categorical
      choices: [low, medium, high]

    Shape:
      type: categorical
      choices: [flat, gently-rounded, convex]

  # ---- Nose Detail (v2) ----
  NoseDNA:
    BridgeWidth:
      type: categorical
      choices: [narrow, narrow-to-medium, medium, wide]

  # ---- Lip Texture (v2) ----
  LipDNA:
    Texture:
      type: categorical
      choices: [matte, natural, smooth-with-natural-gloss, glossy]

  # ---- Body Detail & Tattoos (v2) ----
  BodyDNA:
    AbsDefinition:
      type: categorical
      choices: [none, soft, defined-visible, shredded]

    Tattoo:
      PelvisRight:
        type: categorical
        choices: [none, small-symbol-text, floral, other]

      PelvisLeft:
        type: categorical
        choices: [none, small-symbol-text, floral, other]

  # ---- Apparel Extensions (v2) ----
  ApparelDNA:
    FrequentBottoms:
      type: categorical
      choices: [denim-shorts, mini-skirts, low-rise-pants, jeans, athletic, mixed]

    Patterns:
      type: categorical
      choices: [leopard-print, floral, solid, striped, mixed]

    Colors:
      type: categorical
      choices: [neon-pink, neon-green, bright-red, neutral, black, white, mixed]

    Gloves:
      type: categorical
      choices: [none, fingerless-black, wrist-length, full-length]

  # ---- Footwear (v2) ----
  FootwearDNA:
    Visibility:
      type: categorical
      choices: [visible, often-out-of-frame, hidden]

# ---- Hands & Nails (v2) ----
HandsDNA:
  Nails:
    Length:
      type: categorical
      choices: [short, medium, long]

    Style:
      type: categorical
      choices: [bare, polished-neutral, polished-color, french, acrylic-gel]

# ---- Jewelry (v2) ----
JewelryDNA:
  Rings:
    Count:
      type: categorical
      choices: [none, single, multiple]

  Bracelets:
    Style:
      type: categorical
      choices: [none, thin-bangles, charm, cuff, mixed]

  Necklaces:
    Style:
      type: categorical
      choices: [none, pendant, choker, layered, statement]

# ---- Makeup (v2) ----
MakeupDNA:
  Eyes:
    Style:
      type: categorical
      choices: [natural, smoky-eye, heavy-smoky-eye-with-black-liner, winged, glam]

    Underliner:
      type: categorical
      choices: [absent, faint, present]

  Lashes:
    type: categorical
    choices: [natural, mascara, long-volumized-mascara-false, false-dramatic]

  Lips:
    Color:
      type: categorical
      choices: [nude, nude-to-pink, pink, red, berry, other]

  Skin:
    Finish:
      type: categorical
      choices: [natural, dewy, satin, medium-coverage-matte, full-coverage-matte]

  Blush:
    Tone:
      type: categorical
      choices: [peach, soft-pink, rose, bronze]

# ---- Behavioral DNA (v2) ----
BehavioralDNA:
  Stance:
    type: categorical
    choices: [neutral, hands-on-hips, hip-pop, contrapposto, dynamic]

  Gestures:
    type: categorical
    choices: [none, hair-flip, torso-sway, hand-flourish, mixed]

# ---- Style Context (v2) ----
StyleContext:
  Environment:
    type: categorical
    choices: [indoor-home-large-windows, studio, beach, urban, outdoor-natural, mixed]

  TimeOfDay:
    type: categorical
    choices: [morning, daylight, mid-day, golden-hour, night]

  BeachShots:
    type: categorical
    choices: [none, occasional, frequent]

