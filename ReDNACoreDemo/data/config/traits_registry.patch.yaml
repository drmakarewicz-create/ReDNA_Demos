# Traits Registry Patch v2.1: Rendering Gap Fixes
# Timestamp: 2025-10-03T21:00:00Z
# Purpose: Address rendering gaps identified in latest portrait analysis
#          - Add missing makeup finish container
#          - Formalize headpiece accessories
#          - Add apparel thematic categorization
# Note: This patch also flags containers needing higher prompt weight
# ============================================================================

MakeupDNA:
  Lips:
    Finish:
      type: categorical
      choices: [matte, natural, gloss, shimmer, metallic]
      # PROMPT_WEIGHT: medium - combine with Lips.Color for realistic finish

PaDNA:
  HairDNA:
    Accessories:
      Headpiece:
        type: categorical
        choices: [none, crown, tiara, flower-crown, headband, veil, fascinator, other]
        # Formalizes pageant/glamour headpiece accessories

  ApparelDNA:
    Themes:
      type: array
      examples: [pageant, glamour, beachwear, casual, athletic, evening-wear, performance, editorial]
      # Thematic context for coherent styling across portrait sets

