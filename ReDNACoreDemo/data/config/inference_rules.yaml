rules:
  - name: hair_skin_to_brow
    conditions:
      - path: PaDNA.HairDNA.Color
        equals: Blonde
      - path: PaDNA.SkinDNA.Undertone
        in:
          - Warm
          - Warm peach-golden
          - Golden
    suggest:
      path: PaDNA.EyeDNA.Brows
      value: "Light brown"
      ucn: 320
      reason: "hair_skin_to_brow"
  - name: eye_shape_to_crease
    conditions:
      - path: PaDNA.EyeDNA.Shape
        equals: Almond
    suggest:
      path: PaDNA.EyeDNA.EyelidCrease
      value: Present
      ucn: 280
      reason: "eye_shape_to_crease"

