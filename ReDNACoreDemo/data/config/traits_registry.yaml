RelDNA:
  Status: {type: categorical, choices: [single, partnered, married, poly, separated, complicated], rr_default: 0, curiosity_default: 100, coach_instructions: 'Confirm current relationship configuration directly with the user; re-ask when major life events occur.'}
  Goals:
    Primary: {type: categorical, choices: [improve_communication, rebuild_trust, strengthen_intimacy, align_values, clarify_boundaries, co_parenting, other], rr_default: 0, curiosity_default: 100, coach_instructions: 'Ask the user to pick or restate their top relationship focus to reduce curiosity.'}
  Preferences:
    LoveLanguages: {type: categorical_multi, choices: [words_of_affirmation, quality_time, acts_of_service, physical_touch, gifts, humor, reassurance], rr_default: 0, curiosity_default: 100, coach_instructions: 'Capture preferred ways the user gives/receives care; confirm with recent examples.'}
    Boundaries: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Record specific boundaries the user wants respected; ask for clarity before logging.'}
  Conflict:
    Style: {type: categorical, choices: [avoidant, validator, volatile, hostile, problem_solver, accommodating], rr_default: 0, curiosity_default: 100, coach_instructions: 'Reflect conflict patterns back to the user and ask if it matches their experience before logging.'}
    RepairStrategies: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Track what repair actions work after conflict so coaches can suggest them later.'}
  Communication:
    Style: {type: categorical, choices: [direct, indirect, high_context, low_context, reflective, analytical], rr_default: 0, curiosity_default: 100, coach_instructions: 'Log the user’s baseline communication style based on explicit statements or confirmed examples.'}
    Cadence: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Capture how often the user prefers check-ins or deeper conversations.'}
  Attachment:
    Style: {type: categorical, choices: [secure, anxious, avoidant, fearful, disorganized], rr_default: 0, curiosity_default: 100, coach_instructions: 'Note attachment self-identification; treat as low confidence unless user states it explicitly.'}
  Triggers: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'List concise triggers that destabilize connection; keep language neutral.'}
  Values:
    Shared: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Capture the value statements both partners align on; cite evidence.'}
    Clashes: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Document value differences that create friction; include nuance if provided.'}
  Boundaries:
    AgreesTo: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Record boundaries the user commits to honoring.'}
    StrugglesWith: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Capture boundary agreements the user finds hard to uphold; revisit periodically.'}
  Safety:
    TopicsToAvoid: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Log sensitive subjects to pause until trust improves; keep details concise.'}
  Context:
    Family: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Summarize family context that affects the relationship dynamic.'}
    Friends: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Capture peer dynamics that influence connection quality.'}
    WorkStress: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Note persistent work stressors impacting the relationship.'}
  Logistics:
    TimeZones: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Record time zone info for coordinating sync moments or RSC sessions.'}
    Schedules: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Log recurring schedule constraints that affect connection time.'}
  MicroActions:
    Backlog: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Store JSON list of tiny actions with status/ts; update when actions complete.'}

SocDNA:
  Conversation:
    ToneDefault: {type: categorical, choices: [warm, neutral, formal, playful, concise, expansive], rr_default: 0, curiosity_default: 100, coach_instructions: 'Capture the user’s natural tone so personas can mirror appropriately.'}
    Pacing: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Describe preferred pacing (rapid-fire, reflective pauses, etc.).'}
    EmojiUsage: {type: categorical, choices: [high, medium, low, none], rr_default: 0, curiosity_default: 100, coach_instructions: 'Track how often the user leans on emoji/emphasis during chats.'}
    TextLengthPattern: {type: categorical, choices: [short_bursts, medium, long_form, mixed], rr_default: 0, curiosity_default: 100, coach_instructions: 'Log default message length to match cadence.'}
  Empathy:
    Signal: {type: categorical, choices: [high, medium, low], rr_default: 0, curiosity_default: 100, coach_instructions: 'Set based on explicit statements or observed behavior; confirm with user when possible.'}
  Humor:
    Style: {type: text, rr_default: 0, curiosity_default: 100, coach_instructions: 'Capture how the user expresses humor so personas can respond appropriately.'}
