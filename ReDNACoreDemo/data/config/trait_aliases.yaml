## Trait aliases for canonical PaDNA mapping.
## Each canonical entry may define:
##   aliases: alternative keys observed in imports
##   value_aliases: mapping of observed values -> canonical values
##
## Extend this list as new data sources introduce additional variants.

# --- HAIR ---
PaDNA.HairDNA.Color:
  aliases: [Hair.Color, hair_colour, Hair shade, Hair hue, PaDNA.Hair.Color]
  value_aliases:
    strawberry blonde: Red-Blonde
    auburn: Red-Brown
    ginger: Red
    dirty blonde: Blonde-Brown
    light brown: Brown-Light
    dark brown: Brown-Dark
    "~platinum": Blonde
    "~golden": Blonde
    "~blonde": Blonde
PaDNA.HairDNA.DyedColor:
  aliases: [Hair.DyedColor, dyed_hair, Hair dye, Cosmetic.Hair.Dye]
  value_aliases:
    "~platinum": Platinum
    "~golden": Golden
PaDNA.HairDNA.Length:
  aliases: [Hair.Length, hair_len, Hair length, Locks.Length]
  value_aliases:
    pixie: Very-Short
    bob: Short
    shoulder: Medium
    mid-back: Long
    waist: Very-Long
    "~mid back": Long
    "~shoulder": Medium
PaDNA.HairDNA.Texture:
  aliases: [Hair.Texture, hair_tex, Strand texture, Curl pattern]
  value_aliases:
    straight: Straight
    wavy: Wavy
    curly: Curly
    coily: Coily
    "~slightly wavy": Wavy
PaDNA.HairDNA.Style:
  aliases: [Hair.Style, hairstyle, updo, ponytail, braid_style]
  value_aliases:
    "~loose": Loose
    "~tousled": Tousled
    "~updo": Updo
PaDNA.HairDNA.Density:
  aliases: [Hair.Density, hair_thickness, volume]
  value_aliases:
    thin: Low
    fine: Low
    thick: High
    medium: Medium
PaDNA.HairDNA.Condition:
  aliases: [Hair.Condition, shine, dryness, frizz]
  value_aliases:
    glossy: Shiny
    dry: Dry
    frizzy: Frizzy
    "~processed": Dry
PaDNA.HairDNA.Hairline:
  aliases: [Hair.Hairline, hairline_shape, widow_peak]
  value_aliases:
    widow's peak: WidowsPeak
PaDNA.HairDNA.Part:
  aliases: [Hair.Part, parting, side part, middle part]
  value_aliases:
    middle: Center
    center: Center
    side: Side
    "~center or side": [Center, Side]
PaDNA.HairDNA.Bald:
  aliases: [Hair.Bald, balding, alopecia]
  value_aliases:
    none: No
    thinning: Partial
    false: No
    true: Yes
PaDNA.HairDNA.Distinctive:
  aliases: [Hair.Distinctive, highlights, streaks, ombré, balayage]
PaDNA.HairDNA.PatternChange:
  aliases: [Hair.PatternChange, perm, chemical_treatment, heat_damage]
  value_aliases:
    "~straight": Straight
    "~wave": Wavy

