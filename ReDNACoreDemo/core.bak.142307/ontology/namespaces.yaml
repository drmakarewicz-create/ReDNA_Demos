# DNA Namespaces - Top-level umbrellas for the Container Explosion Architecture
# Version: 2.0 (Ontology v1 Baseline)
# Last updated: 2025-10-06
# Purpose: Defines the 14 canonical DNA umbrellas for 1k→10k→100k→1M container expansion

namespaces:
  # ═══════════════════════════════════════════════════════════════════
  # Physical & Observable Traits
  # ═══════════════════════════════════════════════════════════════════

  PaDNA:
    full_name: "Physical Appearance DNA"
    description: "Observable physical characteristics including facial features, body morphology, hair, skin, voice, and sensory presentation"
    sensitive: false
    camouflage: false
    max_depth: 3
    naming_pattern: "^PaDNA(\\.[A-Z][a-zA-Z0-9]+DNA)*$"
    curiosity_policy: "Always 100 for new traits; user-modifiable"
    rr_policy: "null until trait has values; computed from population distributions"
    top_families:
      - FaceDNA
      - HairDNA
      - EyeDNA
      - SkinDNA
      - BodyDNA
      - VoiceOlfactionMotionDNA

  # ═══════════════════════════════════════════════════════════════════
  # Psychological & Internal Traits
  # ═══════════════════════════════════════════════════════════════════

  PsyDNA:
    full_name: "Psychological DNA"
    description: "Core personality traits, motivational drivers, belief systems, self-concept, and stable psychological patterns"
    sensitive: true
    camouflage: false
    max_depth: 3
    naming_pattern: "^PsyDNA(\\.[A-Z][a-zA-Z0-9]+DNA)*$"
    curiosity_policy: "Default 100; inherently high-curiosity domain"
    rr_policy: "null until trait values exist; RR computed from user population"
    top_families:
      - PersonalityDNA
      - MotivationDNA
      - BeliefValueDNA
      - SelfConceptSchemaDNA

  EmDNA:
    full_name: "Emotional DNA"
    description: "Emotional baselines, regulation patterns, empathy, attachment styles, and affective dynamics"
    sensitive: true
    camouflage: false
    max_depth: 3
    naming_pattern: "^EmDNA(\\.[A-Z][a-zA-Z0-9]+DNA)*$"
    curiosity_policy: "Default 100; emotional exploration encouraged"
    rr_policy: "null until populated; RR based on distribution fit"
    top_families:
      - AffectBaselineDNA
      - EmotionRegulationDNA
      - ReactivityArousalDNA
      - EmpathyCompassionDNA
      - AttachmentStyleDNA
      - AngerGuiltShameDNA
      - GratitudeForgivenessDNA
      - ConflictEmotionalStyleDNA

  CogDNA:
    full_name: "Cognitive DNA"
    description: "Memory systems, reasoning patterns, creativity, attention, learning styles, and cognitive processing dynamics"
    sensitive: false
    camouflage: false
    max_depth: 3
    naming_pattern: "^CogDNA(\\.[A-Z][a-zA-Z0-9]+DNA)*$"
    curiosity_policy: "Default 100; self-knowledge domain"
    rr_policy: "null until traits exist; RR from population benchmarks"
    top_families:
      - MemorySystemsDNA
      - ProcessingDynamicsDNA
      - ReasoningProblemSolvingDNA
      - CreativityDivergenceDNA
      - AttentionControlDNA
      - MetacognitionInsightDNA
      - LearningStyleStrategyDNA
      - LanguageCognitionDNA

  SocDNA:
    full_name: "Social/Relational Style DNA"
    description: "Social interaction patterns, role preferences, trust dynamics, influence styles, and group behavior"
    sensitive: true
    camouflage: false
    max_depth: 3
    naming_pattern: "^SocDNA(\\.[A-Z][a-zA-Z0-9]+DNA)*$"
    curiosity_policy: "Default 100; social self-awareness encouraged"
    rr_policy: "null until populated; RR computed from user distributions"
    top_families:
      - InteractionStyleDNA
      - RolePreferenceDNA
      - TrustBoundaryReciprocityDNA
      - NegotiationInfluenceDNA
      - SocialAdaptabilityNetworkingDNA
      - GroupAlignmentIdentityDNA

  BehDNA:
    full_name: "Behavioral DNA"
    description: "Habits, routines, daily rhythms, risk-taking patterns, addictive tendencies, and micro-behavioral tics"
    sensitive: false
    camouflage: false
    max_depth: 3
