# ═══════════════════════════════════════════════════════════════════
# Naming Rules (enforced by linter)
# ═══════════════════════════════════════════════════════════════════

naming_rules:
  container_name:
    pattern: "^[A-Z][a-zA-Z0-9]+DNA$"
    description: "Must start with capital, end with 'DNA', PascalCase only"
    examples:
      - "HairDNA"
      - "ColorDNA"
      - "EyebrowShapeDNA"

  path:
    separator: "."
    min_depth: 1
    max_depth: 3
    description: "Hierarchical path: Umbrella.SubDNA.SubSubDNA (max 3 levels)"
    examples:
      - "PaDNA"
      - "PaDNA.FaceDNA"
      - "PaDNA.FaceDNA.NoseDNA"

  version:
    pattern: "^v\\d+$"
    description: "Version suffix for versioned containers"
    examples:
      - "v1"
      - "v2"

# ═══════════════════════════════════════════════════════════════════
# Edge Type Rules
# ═══════════════════════════════════════════════════════════════════

edge_types:
  is_a:
    description: "Taxonomic hierarchy (child is a type of parent)"
    transitive: true
    allow_cycles: false
    examples:
      - "PaDNA.HairDNA.ScalpHairDNA is_a PaDNA.HairDNA"

  part_of:
    description: "Compositional hierarchy (child is part of parent)"
    transitive: true
    allow_cycles: false
    examples:
      - "PaDNA.FaceDNA.NoseDNA part_of PaDNA.FaceDNA"

  derived_from:
    description: "Computational dependency (child computed from parent)"
    transitive: false
    allow_cycles: false
    examples:
      - "PsyDNA.SelfConceptSchemaDNA derived_from PsyDNA.PersonalityDNA"

  correlates_with:
    description: "Statistical correlation (bidirectional, stubbed for now)"
    transitive: false
    allow_cycles: true
    min_evidence: 0.25
    max_evidence: 1.0
    examples:
      - "PaDNA.HairDNA.ColorDNA correlates_with PaDNA.SkinDNA.ToneDNA (0.68)"

  contradicts:
    description: "Logical contradiction (mutually exclusive)"
    transitive: false
    allow_cycles: true
    examples:
      - "PaDNA.HairDNA.BaldDNA contradicts PaDNA.HairDNA.LongHairDNA"

# ═══════════════════════════════════════════════════════════════════
# Privacy & Sensitivity Rules
# ═══════════════════════════════════════════════════════════════════

privacy_rules:
  sensitive_namespaces:
    - PsyDNA
    - EmDNA
    - SocDNA
    - HistDNA
    - HealthDNA
    - RoDNA
    - EnvDNA

  camouflage_required:
    - RoDNA.*

  consent_required:
    - HealthDNA.*

  k_anonymity:
    min_k: 5
    description: "Minimum users required for distribution creation"

# ═══════════════════════════════════════════════════════════════════
# Status Lifecycle
# ═══════════════════════════════════════════════════════════════════

status_transitions:
  prototype:
    next: ["candidate", "deprecated"]
    description: "Initial creation, experimental"
    requires_approval: false

  candidate:
    next: ["stable", "deprecated"]
    description: "Validated, ready for production"
    requires_approval: true

  stable:
    next: ["deprecated"]
    description: "Production-ready, widely used"
    requires_approval: true

  deprecated:
    next: []
    description: "No longer recommended, archived"
    requires_approval: true
