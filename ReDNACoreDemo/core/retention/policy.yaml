# ReDNA Data Retention Policy
# Version: 1.0.0-placeholder
# Status: Stub - Full implementation pending Phase 3

version: "1.0.0"
status: "placeholder"
last_updated: "2025-10-14"

# Retention rules for ReDNA data lifecycle
# This is a placeholder file referenced by Architecture_Reliability_Plan.md

retention_rules:
  evidence:
    # Raw evidence items (evidence.json)
    retention_days: 365
    archive_after_days: 90
    compression: true

  resolved:
    # Resolved traits (resolved.json)
    retention_days: -1  # Keep forever
    snapshot_frequency_days: 30

  observations:
    # Legacy observations (observations.json)
    retention_days: 180
    migration_status: "pending_v2_schema"

  chat_history:
    # Chat turn events
    retention_days: 365
    pii_redaction: true

  resolver_traces:
    # Debug traces from resolver
    retention_days: 30
    auto_cleanup: true

# Cleanup policies
cleanup:
  enabled: false  # Will be enabled in Phase 3
  schedule_cron: "0 2 * * 0"  # Weekly at 2am Sunday

# Audit logging
audit:
  enabled: false
  log_all_deletions: true

