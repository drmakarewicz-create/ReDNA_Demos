[pytest]
testpaths =
    ReDNACoreDemo/tests
    ReDNACoreDemo/devx/backend/tests
    PaDNAOutboundDemo/tests
    ExplorerFinal/tests
    tests
norecursedirs =
    snapshots
    **/snapshots
    **/__pycache__
    .git
    build
    dist
    2025-09-19_*
pythonpath =
    ReDNACoreDemo
    PaDNAOutboundDemo
    ExplorerFinal
    PhotoRefinementCoach
addopts = -ra
markers =
    e2e: marks end-to-end tests that require running services (deselect with '-m \"not e2e\"')
