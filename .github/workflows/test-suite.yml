name: Test Suite

on:
  push:
    branches: [ main, ontology_explosion_v2 ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-asyncio pytest-cov

      - name: Resolver import canary
        run: ./scripts/check_resolver_imports.sh

      - name: Run tests with coverage
        env:
          PYTHONPATH: .:ReDNACoreDemo
        run: |
          python -m pytest tests/ ReDNACoreDemo/tests/ \
            -v \
            --tb=short \
            --cov=ReDNACoreDemo/core \
            --cov-report=xml \
            --cov-report=term-missing \
            --maxfail=5 \
            -x

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.13'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
            coverage.xml
          retention-days: 14

  stack-troubleshooter-e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Bootstrap stack
        env:
          PYTHONPATH: .:ReDNACoreDemo
        run: |
          python scripts/cppp_bootstrap.py --quiet

      - name: Verify stack health
        run: |
          curl -s http://127.0.0.1:8100/devx/api/stack/status | jq -e '([.services[] | select(.status != "healthy")] | length) == 0'

      - name: Restart UCNRR via API
        run: |
          pkill -f ucnrr_app || true
          sleep 6
          curl -s -X POST http://127.0.0.1:8100/devx/api/stack/restart \
            -H 'Content-Type: application/json' \
            -d '{"service": "ucnrr", "port": 8011}'
          sleep 3
          curl -s http://127.0.0.1:8011/health | jq -e '.status == "healthy"'

      - name: Tear down stack
        if: always()
        run: |
          pkill -f uvicorn || true
